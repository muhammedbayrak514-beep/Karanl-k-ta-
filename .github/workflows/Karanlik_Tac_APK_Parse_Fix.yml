
name: Karanlik Tac - Android APK

on:
  workflow_dispatch:
    inputs:
      project_zip:
        description: "Oyun projesinin ZIP dosya adi"
        required: true
        default: "Karanlik_Tac_APK_Parse_Fix.zip"
        type: string
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2-stable"
  GODOT_TEMPLATE_VERSION: "4.7.2.stable"

jobs:
  build-apk:
    name: Godot kontrol ve APK derleme
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: GitHub deposunu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Proje ZIP dosyasini bul ve ac
        env:
          REQUESTED_PROJECT_ZIP: ${{ inputs.project_zip }}
        shell: bash
        run: |
          set -euo pipefail

          ZIP_PATH="${REQUESTED_PROJECT_ZIP:-Karanlik_Tac_APK_Parse_Fix.zip}"

          if [ ! -f "$ZIP_PATH" ]; then
            echo "::error::ZIP bulunamadi: $ZIP_PATH"
            find . -maxdepth 2 -type f -iname '*.zip'
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/game-source"
          unzip -q "$ZIP_PATH" -d "$RUNNER_TEMP/game-source"

          PROJECT_FILE="$(find "$RUNNER_TEMP/game-source" \
            -type f -name project.godot -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::ZIP icinde project.godot bulunamadi."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          test -f "$PROJECT_DIR/export_presets.cfg"
          test -f "$PROJECT_DIR/scripts/game.gd"

      - name: Godot motorunu indir
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"

          curl -fL --retry 3 \
            "$BASE/Godot_v${GODOT_VERSION}_linux.x86_64.zip" \
            -o godot.zip

          mkdir -p godot-bin
          unzip -q godot.zip -d godot-bin

          GODOT_BIN="$(find godot-bin -type f \
            -name 'Godot_v*_linux.x86_64' -print -quit)"

          test -n "$GODOT_BIN"
          sudo install -m 0755 "$GODOT_BIN" /usr/local/bin/godot

          curl -fL --retry 3 \
            "$BASE/Godot_v${GODOT_VERSION}_export_templates.tpz" \
            -o templates.tpz

          mkdir -p templates
          unzip -q templates.tpz -d templates

          TEMPLATE_SOURCE="$(find templates -type f \
            -name android_debug.apk -print -quit)"

          if [ -z "$TEMPLATE_SOURCE" ]; then
            echo "::error::Android export sablonu bulunamadi."
            exit 1
          fi

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          mkdir -p "$TEMPLATE_DIR"
          cp -R "$(dirname "$TEMPLATE_SOURCE")/." "$TEMPLATE_DIR/"

          godot --version

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Android SDK yolunu ayarla
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: GDScript ve proje kontrolu
        shell: bash
        run: |
          set -euo pipefail

          set +e
          godot --headless --editor \
            --path "$PROJECT_DIR" --quit 2>&1 | tee godot-check.log
          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$STATUS" -ne 0 ] || \
            grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script|Failed loading resource' godot-check.log; then
            echo "::error::GDScript kontrolu basarisiz. APK uretilmedi."
            exit 1
          fi

      - name: Oyunu baslatma kontrolu
        shell: bash
        run: |
          set -euo pipefail

          set +e
          godot --headless --path "$PROJECT_DIR" \
            --quit-after 180 2>&1 | tee godot-startup.log
          STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$STATUS" -ne 0 ] || \
            grep -Eiq 'SCRIPT ERROR:|Parse Error:|Failed to load script|Failed loading resource' godot-startup.log; then
            echo "::error::Oyun baslangic kontrolu basarisiz."
            exit 1
          fi

      - name: Android APK olustur
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build

          godot --headless --path "$PROJECT_DIR" \
            --export-debug "Android" \
            "$GITHUB_WORKSPACE/build/KaranlikTac-debug.apk" \
            2>&1 | tee godot-export.log

          test -s "$GITHUB_WORKSPACE/build/KaranlikTac-debug.apk"
          unzip -t "$GITHUB_WORKSPACE/build/KaranlikTac-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/build/KaranlikTac-debug.apk" \
            > "$GITHUB_WORKSPACE/build/apk-sha256.txt"

      - name: Hata gunluklerini kaydet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Karanlik-Tac-build-diagnostics
          path: |
            godot-check.log
            godot-startup.log
            godot-export.log
          if-no-files-found: ignore
          retention-days: 14

      - name: APK dosyasini yukle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Karanlik-Tac-Android-APK
          path: |
            build/KaranlikTac-debug.apk
            build/apk-sha256.txt
          if-no-files-found: error
          retention-days: 14
