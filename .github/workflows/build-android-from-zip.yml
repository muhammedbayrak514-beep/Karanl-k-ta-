
name: Karanlik Tac - Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: ZIP dosyasini bul ve cikar
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Karanlik_Tac_v0.15.0_Entegre_5_Sistem.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::ZIP dosyasi depo ana dizininde bulunamadi: $ZIP_FILE"
            echo "Depodaki dosyalar:"
            ls -la
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_FILE="$(find extracted -type f -name project.godot -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::ZIP icinde project.godot bulunamadi."
            find extracted -maxdepth 3 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Godot projesi bulundu: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Godot 4.7.2 kur
        shell: bash
        run: |
          set -euo pipefail

          VERSION="4.7.2-stable"
          BASE="https://github.com/godotengine/godot-builds/releases/download/${VERSION}"

          curl -fL --retry 3 \
            "${BASE}/Godot_v${VERSION}_linux.x86_64.zip" \
            -o godot.zip

          unzip -q godot.zip -d godot-bin

          GODOT_BIN="$(find godot-bin -type f -name 'Godot_v*_linux.x86_64' -print -quit)"

          if [ -z "$GODOT_BIN" ]; then
            echo "::error::Godot calistirilabilir dosyasi bulunamadi."
            exit 1
          fi

          sudo install -m 0755 "$GODOT_BIN" /usr/local/bin/godot
          godot --version

      - name: Android doku ayarini duzelt
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          project_file = Path(os.environ["PROJECT_DIR"]) / "project.godot"
          content = project_file.read_text(encoding="utf-8")
          lines = content.splitlines()

          section = "[rendering]"
          setting = "textures/vram_compression/import_etc2_astc"

          start = next(
              (i for i, line in enumerate(lines)
               if line.strip() == section),
              None
          )

          if start is None:
              lines.extend(["", section, setting + "=true"])
          else:
              end = next(
                  (i for i in range(start + 1, len(lines))
                   if re.match(r"^\s*\[.*\]\s*$", lines[i])),
                  len(lines)
              )

              found = False
              for i in range(start + 1, end):
                  if re.match(
                      r"^\s*" + re.escape(setting) + r"\s*=",
                      lines[i]
                  ):
                      lines[i] = setting + "=true"
                      found = True
                      break

              if not found:
                  lines.insert(end, setting + "=true")

          project_file.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )

          print("Android ETC2/ASTC ayari etkinlestirildi.")
          print("Ayar:", setting, "= true")
          PY

          grep -n "import_etc2_astc" "$PROJECT_DIR/project.godot"

      - name: Android export sablonlarini indir
        shell: bash
        run: |
          set -euo pipefail

          VERSION="4.7.2-stable"
          BASE="https://github.com/godotengine/godot-builds/releases/download/${VERSION}"

          curl -fL --retry 3 \
            "${BASE}/Godot_v${VERSION}_export_templates.tpz" \
            -o templates.tpz

          mkdir -p templates-unpacked
          unzip -q templates.tpz -d templates-unpacked

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${VERSION}"

          mkdir -p "$TEMPLATE_DIR"
          cp -R templates-unpacked/templates/. "$TEMPLATE_DIR/"

          test -f "$TEMPLATE_DIR/android_debug.apk"
          echo "Android export sablonlari hazir."

      - name: Android export preset kontrolu
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ ! -f export_presets.cfg ]; then
            echo "::error::export_presets.cfg bulunamadi. Projede Android export preset'i olusturulmamis."
            exit 1
          fi

          if ! grep -q 'name="Android"' export_presets.cfg; then
            echo "::error::export_presets.cfg icinde adi Android olan preset bulunamadi."
            echo "Mevcut preset adlari:"
            grep 'name=' export_presets.cfg || true
            exit 1
          fi

          echo "Android export preset bulundu."

      - name: Projeyi ice aktar
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          godot --headless --editor --path . --quit \
            2>&1 | tee "$GITHUB_WORKSPACE/godot-import.log"

      - name: Android APK olustur
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          mkdir -p build

          godot --headless --path . \
            --export-debug "Android" \
            build/KaranlikTac-debug.apk \
            2>&1 | tee "$GITHUB_WORKSPACE/godot-export.log"

          if [ ! -s build/KaranlikTac-debug.apk ]; then
            echo "::error::APK olusmadi veya dosya bos."
            exit 1
          fi

          echo "APK basariyla olusturuldu."
          ls -lh build/KaranlikTac-debug.apk

      - name: APK dosyasini yukle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Karanlik-Tac-Android-APK
          path: ${{ env.PROJECT_DIR }}/build/KaranlikTac-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Hata kayitlarini yukle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Karanlik-Tac-Hata-Kayitlari
          path: |
            godot-import.log
            godot-export.log
          if-no-files-found: ignore
          retention-days: 7
