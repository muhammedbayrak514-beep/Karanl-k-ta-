
name: Karanlik Tac - Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: ZIP dosyasini bul ve cikar
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Karanlik_Tac_v0.15.0_Entegre_5_Sistem.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::ZIP dosyasi bulunamadi: $ZIP_FILE"
            ls -la
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_FILE="$(find extracted -type f -name project.godot -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "::error::ZIP icinde project.godot bulunamadi."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Proje bulundu: $PROJECT_DIR"

      - name: Godot 4.7.2 kur
        shell: bash
        run: |
          set -euo pipefail

          VERSION="4.7.2-stable"
          BASE="https://github.com/godotengine/godot-builds/releases/download/${VERSION}"

          curl -fL --retry 3 \
            "${BASE}/Godot_v${VERSION}_linux.x86_64.zip" \
            -o godot.zip

          unzip -q godot.zip -d godot-bin

          GODOT_BIN="$(find godot-bin -type f -name 'Godot_v*_linux.x86_64' -print -quit)"

          if [ -z "$GODOT_BIN" ]; then
            echo "::error::Godot calistirilabilir dosyasi bulunamadi."
            exit 1
          fi

          sudo install -m 0755 "$GODOT_BIN" /usr/local/bin/godot
          godot --version

      - name: Android doku ayarini etkinlestir
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"]) / "project.godot"
          lines = project.read_text(encoding="utf-8").splitlines()
          setting = "textures/vram_compression/import_etc2_astc"

          start = next(
              (i for i, line in enumerate(lines)
               if line.strip() == "[rendering]"),
              None
          )

          if start is None:
              lines.extend(["", "[rendering]", setting + "=true"])
          else:
              end = next(
                  (i for i in range(start + 1, len(lines))
                   if re.match(r"^\s*\[.*\]\s*$", lines[i])),
                  len(lines)
              )
              found = False
              for i in range(start + 1, end):
                  if re.match(
                      r"^\s*" + re.escape(setting) + r"\s*=",
                      lines[i]
                  ):
                      lines[i] = setting + "=true"
                      found = True
                      break
              if not found:
                  lines.insert(end, setting + "=true")

          project.write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8"
          )
          print("ETC2/ASTC Android ayari etkinlestirildi.")
          PY

      - name: game.gd girinti hatasini duzelt
        shell: bash
        run: |
          set -euo pipefail

          GAME_SCRIPT="$PROJECT_DIR/scripts/game.gd"

          if [ ! -f "$GAME_SCRIPT" ]; then
            echo "::error::scripts/game.gd bulunamadi."
            exit 1
          fi

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["PROJECT_DIR"]) / "scripts/game.gd"
          lines = path.read_text(encoding="utf-8-sig").splitlines()

          # _on_settlement_action_pressed fonksiyonundaki
          # iki satirin fazladan girintisini duzelt.
          fixed = 0
          for i, line in enumerate(lines):
              if line.lstrip().startswith("_refresh_progress_panels()"):
                  if i > 0 and "_show_settlement_result(" in lines[i - 1]:
                      indent = len(line) - len(line.lstrip())
                      if indent == 2:
                          lines[i] = "\t_refresh_progress_panels()"
                          fixed += 1
              elif line.lstrip().startswith("_refresh_settlement_panel_if_open()"):
                  if i > 0 and "_refresh_progress_panels()" in lines[i - 1]:
                      indent = len(line) - len(line.lstrip())
                      if indent == 2:
                          lines[i] = "\t_refresh_settlement_panel_if_open()"
                          fixed += 1

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"Girinti duzeltme sayisi: {fixed}")
          PY

          echo "Duzeltilen bolum:"
          nl -ba "$GAME_SCRIPT" | sed -n '1488,1502p'

      - name: Android export sablonlarini kur
        shell: bash
        run: |
          set -euo pipefail

          VERSION="4.7.2-stable"
          TEMPLATE_VERSION="4.7.2.stable"
          BASE="https://github.com/godotengine/godot-builds/releases/download/${VERSION}"

          curl -fL --retry 3 \
            "${BASE}/Godot_v${VERSION}_export_templates.tpz" \
            -o templates.tpz

          mkdir -p templates-unpacked
          unzip -q templates.tpz -d templates-unpacked

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${TEMPLATE_VERSION}"
          mkdir -p "$TEMPLATE_DIR"

          DEBUG_TEMPLATE="$(find templates-unpacked -type f -name android_debug.apk -print -quit)"
          RELEASE_TEMPLATE="$(find templates-unpacked -type f -name android_release.apk -print -quit)"

          if [ -z "$DEBUG_TEMPLATE" ] || [ -z "$RELEASE_TEMPLATE" ]; then
            echo "::error::Android export sablonlari bulunamadi."
            find templates-unpacked -type f | head -100
            exit 1
          fi

          cp "$DEBUG_TEMPLATE" "$TEMPLATE_DIR/android_debug.apk"
          cp "$RELEASE_TEMPLATE" "$TEMPLATE_DIR/android_release.apk"
          printf '%s\n' "$TEMPLATE_VERSION" > "$TEMPLATE_DIR/version.txt"

          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"
          echo "Android sablonlari kuruldu."

      - name: Android export preset kontrolu
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ ! -f export_presets.cfg ]; then
            echo "::error::export_presets.cfg bulunamadi."
            exit 1
          fi

          if ! grep -q 'name="Android"' export_presets.cfg; then
            echo "::error::Android isimli export preset'i bulunamadi."
            grep 'name=' export_presets.cfg || true
            exit 1
          fi

      - name: Projeyi ice aktar ve GDScript hatalarini kontrol et
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          set +e
          godot --headless --editor --path . --quit \
            2>&1 | tee "$GITHUB_WORKSPACE/godot-import.log"
          GODOT_STATUS=${PIPESTATUS[0]}
          set -e

          if grep -Eq 'SCRIPT ERROR: Parse Error|Failed to load script|Parse Error:' \
            "$GITHUB_WORKSPACE/godot-import.log"; then
            echo "::error::GDScript hatasi bulundu. APK olusturulmayacak."
            exit 1
          fi

          if [ "$GODOT_STATUS" -ne 0 ]; then
            echo "::error::Godot proje aktarimi basarisiz."
            exit 1
          fi

      - name: Android APK olustur
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          mkdir -p build

          set +e
          godot --headless --path . \
            --export-debug "Android" \
            build/KaranlikTac-debug.apk \
            2>&1 | tee "$GITHUB_WORKSPACE/godot-export.log"
          GODOT_STATUS=${PIPESTATUS[0]}
          set -e

          if grep -Eq 'SCRIPT ERROR: Parse Error|Failed to load script|Parse Error:' \
            "$GITHUB_WORKSPACE/godot-export.log"; then
            echo "::error::GDScript hatasi bulundu. APK yayinlanmayacak."
            exit 1
          fi

          if [ "$GODOT_STATUS" -ne 0 ] || [ ! -s build/KaranlikTac-debug.apk ]; then
            echo "::error::APK olusturulamadi."
            exit 1
          fi

          ls -lh build/KaranlikTac-debug.apk

      - name: APK dosyasini yukle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Karanlik-Tac-Android-APK
          path: ${{ env.PROJECT_DIR }}/build/KaranlikTac-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Hata kayitlarini yukle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Karanlik-Tac-Hata-Kayitlari
          path: |
            godot-import.log
            godot-export.log
          if-no-files-found: ignore
          retention-days: 7
